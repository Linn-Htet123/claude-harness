<!doctype html><html><head><meta charset="utf-8"><title>Expedition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/duel.css"></head>
<body class="arena">
<header>
  <div class="hbar">
    <a href="/" class="back">← the map</a>
    <span class="region"><span class="lbl">⛰ CHARTING</span><span id="region-title">…</span></span>
  </div>
  <div class="journey" id="journey"></div>
</header>

<div class="wrap"><div class="body">
  <nav class="rail" id="rail"></nav>
  <main>
    <div id="controls"></div>
    <div id="diffwrap" hidden><div id="diffhead"><span>📝 Build changes</span><span id="diffstat"></span></div><pre id="diff"></pre></div>

    <section class="chart fog" id="chart"></section>
    <section class="rift fog" id="rift"></section>

    <div class="scoutsHd">THE TWO SURVEYS</div>
    <div class="scouts">
      <section class="scout cl fog" id="scout-claude"></section>
      <section class="scout cx fog" id="scout-codex"></section>
    </div>

    <section class="region-sec" id="region">
      <div class="scoutsHd">⛵ EXPEDITION LOG</div>
      <div id="log" class="log"></div>
    </section>
  </main>
</div></div>

<div id="session" class="sessionbar"></div>
<script src="/static/arena.js"></script>
</body></html>
